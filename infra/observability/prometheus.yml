global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: geospatial-climate-api
    metrics_path: /metrics
    static_configs:
      - targets: ["geo-api:8070"]
        labels:
          service: geospatial-climate-intelligence
          layer: serving
