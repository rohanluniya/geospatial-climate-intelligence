apiVersion: batch/v1
kind: CronJob
metadata:
  name: geo-climate-daily-pipeline
  namespace: geospatial-climate
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: pipeline
              image: geospatial-climate-intelligence:0.1.0
              command: ["geo-climate", "run", "--compact"]
              resources:
                requests:
                  cpu: "1000m"
                  memory: "2Gi"
                limits:
                  cpu: "4000m"
                  memory: "6Gi"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
