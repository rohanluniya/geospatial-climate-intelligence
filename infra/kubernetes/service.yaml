apiVersion: v1
kind: Service
metadata:
  name: geo-climate-api
  namespace: geospatial-climate
spec:
  type: ClusterIP
  selector:
    app: geo-climate-api
  ports:
    - name: http
      port: 8070
      targetPort: 8070
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geo-climate-api-netpol
  namespace: geospatial-climate
spec:
  podSelector:
    matchLabels:
      app: geo-climate-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8070
