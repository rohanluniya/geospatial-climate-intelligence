[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "geospatial-climate-intelligence"
version = "0.1.0"
description = "Planet-Scale Geospatial & Climate Intelligence Engine — STAC, COG/GeoTIFF, GeoParquet, xarray/Dask, Apache Iceberg V2, and Reproducible Tile Serving"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Ankita Deshmukh", email = "ankdeshm@users.noreply.github.com" },
]
dependencies = [
  "rasterio==1.5.2",
  "shapely==2.2.0",
  "pyproj==3.8.0",
  "xarray==2026.9.0",
  "dask[array]==2026.8.0",
  "pystac==1.16.0",
  "pyiceberg[sql-sqlite,pyiceberg-core]==0.12.0",
  "duckdb==2.0.0",
  "pyarrow==25.0.1",
  "fastavro==1.13.1",
  "fastapi==0.163.2",
  "uvicorn==0.54.0",
  "pillow>=11.0.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "matplotlib>=3.9.0",
  "requests>=2.32.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "hypothesis>=6.115.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-requests>=2.32.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
geo-climate = "services.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["geo_climate", "ingestion", "processing", "models", "services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^processing/spark/", "^processing/airflow/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]
